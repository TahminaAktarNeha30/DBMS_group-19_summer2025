<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Package Management</title>
    
    <!-- Extension error suppression must load first -->
    <script>
        // Immediate suppression before any other scripts load
        window.addEventListener('unhandledrejection', function(event) {
            if (event.reason && event.reason.message && 
                (event.reason.message.includes('message channel closed') || 
                 event.reason.message.includes('listener indicated an asynchronous response'))) {
                event.preventDefault();
            }
        });
        
        window.addEventListener('error', function(event) {
            if (event.error && event.error.message && 
                (event.error.message.includes('message channel closed') || 
                 event.error.message.includes('listener indicated an asynchronous response'))) {
                event.preventDefault();
                event.stopPropagation();
            }
        });
    </script>
    <script src="js/suppress-extension-errors.js"></script>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Package Management</h1>
        <a href="index.html">Back to Home</a>
    </header>

    <main>
        <div class="form-container">
            <form id="packageForm">
                <div class="form-group">
                    <label for="packageId">Package ID:</label>
                    <input type="text" id="packageId" name="packageId" required>
                </div>

                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="packagingInfo">Packaging Information:</label>
                    <textarea id="packagingInfo" name="packagingInfo" required></textarea>
                </div>

                <div class="form-group">
                    <label for="type">Type:</label>
                    <select id="type" name="type" required>
                        <option value="">Select Type</option>
                        <option value="raw">Raw Material</option>
                        <option value="processed">Processed</option>
                        <option value="finished">Finished Product</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="weight">Weight per Package (gm):</label>
                    <input type="number" id="weight" name="weight" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="productionDate">Production Date:</label>
                    <input type="date" id="productionDate" name="productionDate" required>
                </div>

                <div class="form-group">
                    <label for="expirationDate">Expiration Date:</label>
                    <input type="date" id="expirationDate" name="expirationDate" required>
                </div>

                <button type="submit">Save Package</button>
            </form>
        </div>

        <h2>Package List</h2>
        <table id="packageTable">
            <thead>
                <tr>
                    <th>Package ID</th>
                    <th>Name</th>
                    <th>Packaging Info</th>
                    <th>Type</th>
                    <th>Weight</th>
                    <th>Production Date</th>
                    <th>Expiration Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be populated by JavaScript -->
            </tbody>
        </table>
    </main>

    <script src="js/package_management.js"></script>
</body>
</html>
