<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Crop Management</h1>
        <a href="index.html">Back to Home</a>
    </header>

    <main>
        <div class="form-container">
            <form id="cropForm">
                <div class="form-group">
                    <label for="cropId">Crop ID:</label>
                    <input type="text" id="cropId" name="cropId" required>
                </div>

                <div class="form-group">
                    <label for="cropName">Crop Name:</label>
                    <input type="text" id="cropName" name="cropName" required>
                </div>

                <div class="form-group">
                    <label for="category">Category:</label>
                    <select id="category" name="category" required>
                        <option value="">Select Category</option>
                        <option value="cereals">Cereals</option>
                        <option value="pulses">Pulses</option>
                        <option value="vegetables">Vegetables</option>
                        <option value="fruits">Fruits</option>
                        <option value="oilseeds">Oilseeds</option>
                        <option value="spices">Spices</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="waterRequirements">Water Requirements (mm/day):</label>
                    <input type="number" id="waterRequirements" name="waterRequirements" 
                           step="0.1" required>
                </div>

                <div class="form-group">
                    <label for="soilPreference">Soil Preference:</label>
                    <select id="soilPreference" name="soilPreference" required>
                        <option value="">Select Soil Preference</option>
                        <option value="clay">Clay</option>
                        <option value="sandy">Sandy</option>
                        <option value="loamy">Loamy</option>
                        <option value="silt">Silt</option>
                        <option value="peat">Peat</option>
                        <option value="chalk">Chalk</option>
                        <option value="any">Any</option>
                    </select>
                </div>

                <button type="submit">Save Crop</button>
            </form>
        </div>

        <h2>Crop List</h2>
        <table id="cropTable">
            <thead>
                <tr>
                    <th>Crop ID</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Water Requirements</th>
                    <th>Soil Preference</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be populated by JavaScript -->
            </tbody>
        </table>
    </main>

    <script src="js/suppress-extension-errors.js"></script>
    <script src="js/crop_management.js"></script>
</body>
</html>
