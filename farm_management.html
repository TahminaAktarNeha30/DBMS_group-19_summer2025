<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Farm Management</h1>
        <a href="index.html">Back to Home</a>
    </header>

    <main>
        <div class="form-container">
            <form id="farmForm">
                <div class="form-group">
                    <label for="farmId">Farm ID:</label>
                    <input type="text" id="farmId" name="farmId" required>
                </div>

                <div class="form-group">
                    <label for="location">Location:</label>
                    <input type="text" id="location" name="location" required>
                </div>

                <div class="form-group">
                    <label for="size">Size (hectares):</label>
                    <input type="number" id="size" name="size" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="soilType">Soil Type:</label>
                    <select id="soilType" name="soilType" required>
                        <option value="">Select Soil Type</option>
                        <option value="clay">Clay</option>
                        <option value="sandy">Sandy</option>
                        <option value="loamy">Loamy</option>
                        <option value="silt">Silt</option>
                        <option value="peat">Peat</option>
                        <option value="chalk">Chalk</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="irrigationMethod">Irrigation Method:</label>
                    <select id="irrigationMethod" name="irrigationMethod" required>
                        <option value="">Select Irrigation Method</option>
                        <option value="drip">Drip Irrigation</option>
                        <option value="sprinkler">Sprinkler System</option>
                        <option value="surface">Surface Irrigation</option>
                        <option value="center_pivot">Center Pivot</option>
                        <option value="subsurface">Subsurface</option>
                    </select>
                </div>

                <button type="submit">Save Farm</button>
            </form>
        </div>

        <h2>Farm List</h2>
        <table id="farmTable">
            <thead>
                <tr>
                    <th>Farm ID</th>
                    <th>Location</th>
                    <th>Size (ha)</th>
                    <th>Soil Type</th>
                    <th>Irrigation Method</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be populated by JavaScript -->
            </tbody>
        </table>
    </main>

    <script src="js/suppress-extension-errors.js"></script>
    <script src="js/farm_management.js"></script>
</body>
</html>
