<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Management</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/suppress-extension-errors.js"></script>
</head>
<body>
    <header>
        <h1>Market Management</h1>
        <a href="index.html">Back to Home</a>
    </header>

    <main>
        <div class="form-container">
            <form id="marketForm">
                <div class="form-group">
                    <label for="marketId">Market ID:</label>
                    <input type="text" id="marketId" name="marketId" required>
                </div>

                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="type">Type:</label>
                    <select id="type" name="type" required>
                        <option value="">Select Type</option>
                        <option value="wholesale">Wholesale</option>
                        <option value="retail">Retail</option>
                        <option value="farmers_market">Farmers Market</option>
                        <option value="supermarket">Supermarket</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="location">Location:</label>
                    <input type="text" id="location" name="location" required>
                </div>

                <div class="form-group">
                    <label for="contactPerson">Contact Person:</label>
                    <input type="text" id="contactPerson" name="contactPerson" required>
                </div>

                <div class="form-group">
                    <label for="operationalHours">Operational Hours:</label>
                    <input type="text" id="operationalHours" name="operationalHours" 
                           placeholder="e.g., Mon-Fri: 9:00-17:00" required>
                </div>

                <div class="form-group">
                    <label for="quantity">Quantity Capacity:</label>
                    <input type="number" id="quantity" name="quantity" step="1" required>
                </div>

                <button type="submit">Save Market</button>
            </form>
        </div>

        <h2>Market List</h2>
        <table id="marketTable">
            <thead>
                <tr>
                    <th>Market ID</th>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Location</th>
                    <th>Contact Person</th>
                    <th>Operational Hours</th>
                    <th>Quantity</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be populated by JavaScript -->
            </tbody>
        </table>
    </main>

    <script src="js/market_management.js"></script>
</body>
</html>
