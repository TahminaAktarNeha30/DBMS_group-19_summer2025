<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Batch Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Product Batch Management</h1>
        <a href="index.html">Back to Home</a>
    </header>

    <main>
        <div class="form-container">
            <form id="batchForm">
                <div class="form-group">
                    <label for="batchId">Batch ID:</label>
                    <input type="text" id="batchId" name="batchId" required>
                </div>

                <div class="form-group">
                    <label for="packageCount">Number of Packages:</label>
                    <input type="number" id="packageCount" name="packageCount" required>
                </div>

                <div class="form-group">
                    <label for="batchWeight">Weight per Batch (kg):</label>
                    <input type="number" id="batchWeight" name="batchWeight" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="qualityStatus">Quality Status:</label>
                    <select id="qualityStatus" name="qualityStatus" required>
                        <option value="">Select Status</option>
                        <option value="approved">Approved</option>
                        <option value="pending">Pending</option>
                        <option value="rejected">Rejected</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="creationDate">Batch Creation Date:</label>
                    <input type="date" id="creationDate" name="creationDate" required>
                </div>

                <button type="submit">Save Batch</button>
            </form>
        </div>

        <h2>Batch List</h2>
        <table id="batchTable">
            <thead>
                <tr>
                    <th>Batch ID</th>
                    <th>Packages</th>
                    <th>Weight</th>
                    <th>Quality Status</th>
                    <th>Creation Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be populated by JavaScript -->
            </tbody>
        </table>
    </main>

    <script src="js/product_batch.js"></script>
</body>
</html>
