<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spoilage Record Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Spoilage Record Management</h1>
        <a href="index.html">Back to Home</a>
    </header>

    <main>
        <div class="form-container">
            <form id="spoilageForm">
                <div class="form-group">
                    <label for="recordId">Record ID:</label>
                    <input type="text" id="recordId" name="recordId" required>
                </div>

                <div class="form-group">
                    <label for="batchId">Batch ID:</label>
                    <input type="text" id="batchId" name="batchId">
                </div>

                <div class="form-group">
                    <label for="quantityLost">Quantity Lost:</label>
                    <input type="number" id="quantityLost" name="quantityLost" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="reason">Reason:</label>
                    <input type="text" id="reason" name="reason">
                </div>

                <div class="form-group">
                    <label for="spoilageDate">Spoilage Date:</label>
                    <input type="date" id="spoilageDate" name="spoilageDate" required>
                </div>

                <button type="submit">Save Spoilage</button>
            </form>
        </div>

        <h2>Spoilage Records</h2>
        <table id="spoilageTable">
            <thead>
                <tr>
                    <th>Record ID</th>
                    <th>Batch ID</th>
                    <th>Quantity Lost</th>
                    <th>Reason</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </main>
    <script src="js/spoilage_record.js"></script>
</body>
</html>
