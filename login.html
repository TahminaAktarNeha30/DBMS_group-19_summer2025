        .form-group { margin-bottom: 1rem; }

        .input-group .toggle { position: absolute; right: .5rem; top: 50%; transform: translateY(-50%); background: transparent; border: 0; color: var(--text-secondary); cursor: pointer; padding: .25rem .5rem; border-radius: var(--radius-sm); }
        .input-group .toggle:hover { color: var(--primary-color); background: var(--bg-secondary); }

    <script>
        function setDefaultCredentials() {
            var email = document.getElementById('email');
            var password = document.getElementById('password');
            if (email && !email.value) email.value = 'example@gmail.com';
            if (password && !password.value) password.value = 'admin1234';
        }
        function setupPasswordToggle() {
            var btn = document.getElementById('togglePassword');
            var input = document.getElementById('password');
            if (!btn || !input) return;
            btn.addEventListener('click', function (e) {
                e.preventDefault();
                var isText = input.getAttribute('type') === 'text';
                input.setAttribute('type', isText ? 'password' : 'text');
                btn.textContent = isText ? 'Show' : 'Hide';
            });
        }
        document.addEventListener('DOMContentLoaded', function(){ setDefaultCredentials(); setupPasswordToggle(); });
    </script>

</head>
