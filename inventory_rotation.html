<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Rotation Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Inventory Rotation Management</h1>
        <a href="index.html">Back to Home</a>
    </header>

    <main>
        <div class="form-container">
            <form id="rotationForm">
                <div class="form-group">
                    <label for="rotationId">Rotation ID:</label>
                    <input type="text" id="rotationId" name="rotationId" required>
                </div>

                <div class="form-group">
                    <label for="strategy">Strategy:</label>
                    <select id="strategy" name="strategy" required>
                        <option value="">Select Strategy</option>
                        <option value="fifo">FIFO (First In, First Out)</option>
                        <option value="lifo">LIFO (Last In, First Out)</option>
                        <option value="fefo">FEFO (First Expired, First Out)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="rotationDate">Rotation Date:</label>
                    <input type="date" id="rotationDate" name="rotationDate" required>
                </div>

                <div class="form-group">
                    <label for="rotationType">Rotation Type:</label>
                    <select id="rotationType" name="rotationType" required>
                        <option value="">Select Type</option>
                        <option value="scheduled">Scheduled</option>
                        <option value="emergency">Emergency</option>
                        <option value="quality_check">Quality Check</option>
                        <option value="restock">Restock</option>
                    </select>
                </div>

                <button type="submit">Save Rotation</button>
            </form>
        </div>

        <h2>Inventory Rotation List</h2>
        <table id="rotationTable">
            <thead>
                <tr>
                    <th>Rotation ID</th>
                    <th>Strategy</th>
                    <th>Rotation Date</th>
                    <th>Type</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be populated by JavaScript -->
            </tbody>
        </table>
    </main>

    <script src="js/inventory_rotation.js"></script>
</body>
</html>
