<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Information</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Farmer Information</h1>
        <a href="index.html">Back to Home</a>
    </header>

    <main>
        <div class="form-container">
            <form id="farmerForm">
                <div class="form-group">
                    <label for="farmerId">Farmer ID:</label>
                    <input type="text" id="farmerId" name="farmerId" required>
                </div>

                <div class="form-group">
                    <label for="firstName">First Name:</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name:</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone:</label>
                    <input type="tel" id="phone" name="phone" pattern="[0-9]{11}" 
                           placeholder="12345678901" required>
                </div>

                <button type="submit">Save Farmer</button>
            </form>
        </div>

        <h2>Farmer List</h2>
        <table id="farmerTable">
            <thead>
                <tr>
                    <th>Farmer ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Phone</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be populated by JavaScript -->
            </tbody>
        </table>
    </main>

    <script src="js/farmer_info.js"></script>
</body>
</html>
